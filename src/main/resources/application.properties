spring.application.name=FitSense

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fitsense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Cali,128
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Spring Data JPA Configuration
spring.jpa.show-sql=true
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate=INFO

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=main.web.services.fitsense.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy


# Application Information for Documentation
# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@


# JWT Configuration Properties
authorization.jwt.secret =WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days = 7

# ChatBox-AI service
chatbox.url=http://localhost:8085
chatbox.apiKey=${CHATBOX_API_KEY:}
chatbox.connectTimeoutMs=50000
chatbox.readTimeoutMs=60000

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.chatbox.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.chatbox.slidingWindowSize=10
resilience4j.circuitbreaker.instances.chatbox.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.chatbox.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.chatbox.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.chatbox.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.chatbox.failureRateThreshold=50
resilience4j.circuitbreaker.instances.chatbox.eventConsumerBufferSize=10

# Resilience4j Retry Configuration
resilience4j.retry.instances.chatbox.maxAttempts=3
resilience4j.retry.instances.chatbox.waitDuration=1s
resilience4j.retry.instances.chatbox.enableExponentialBackoff=true
resilience4j.retry.instances.chatbox.exponentialBackoffMultiplier=2